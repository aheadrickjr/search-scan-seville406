# Third-party OTA / listing-aggregator domains of interest.
ota_domains:
  - expedia.com
  - hotels.com
  - vrbo.com
  - travelocity.com
  - rentbyowner.com
  - vacationrenter.com
  - booking.com
  - airbnb.com
