# Domain classification lists used by the rule-based classifier.
# Add subdomains/aliases as you discover them. Matching is done against the
# registrable domain (e.g. "www.pirentals.com" matches "pirentals.com").

# Domains owned/operated by the former manager (Padre Island Rentals).
pir_domains:
  - pirentals.com

# Domains owned/operated by the current manager (Franke Rentals).
franke_domains:
